only_rules:
  - array_init
  - closing_brace
  - closure_parameter_position
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - direct_return
  - discouraged_assert
  - discouraged_none_name
  - discouraged_object_literal
  - empty_collection_literal
  - for_where
  - force_try
  - period_spacing
  - protocol_property_accessors_order
  - redundant_discardable_let
  - redundant_objc_attribute
  - redundant_sendable
  - redundant_set_access_control
  - redundant_string_enum_value
  - redundant_void_return
  - return_arrow_whitespace
  - self_binding
  - shorthand_argument
  - shorthand_optional_binding
  - unneeded_break_in_switch
  - weak_delegate
  - void_return
  - custom_rules

analyzer_rules:
  - unused_import

custom_rules:
  localized_uppercase:
    name: "Localized Uppercase"
    regex: "uppercased\\(\\)"
    message: "Please use localizedUppercase instead"
    severity: error
  localized_lowercase:
    name: "Localized Lowercase"
    regex: "lowercased\\(\\)"
    message: "Please use localizedLowercase instead"
    severity: error
  lowercase_uuid:
    name: "Lowercase UUID"
    regex: ".uuidString"
    message: "Please use lowercaseUUIDString instead"
    severity: error
  unowned_self:
    name: "Unowned Self"
    regex: "unowned self"
    message: "Please use weak self instead"
    severity: error
  print:
    name: "Log"
    regex: "(print[(].*[)]|NSLog[(].*[)])"
    message: "Please use Log() instead"
    severity: error
    excluded: bin/swift
  navigation_item_title:
    name: "Navigation Item Title"
    regex: "\\.\\s*navigationItem\\s*\\.\\s*title\\s+=\\s+"
    message: "Please use navigationItem.titleView = .navigationBarTitleView(String) instead (EMEA friendly)"
    severity: error
  individual_member_imports:
    name: "Individual Member Imports"
    regex: "^import +[^ \\n;]+ +[^ \\n;]+"
    message: "Please avoid importing individual members: https://google.github.io/swift/#import-statements"
    severity: error
  named_assets:
    name: "Named Assets"
    regex: "\\(named: .*\\)"
    message: "Do not use named assets; use autogenerated accessors"
    severity: error
  named_color_force_unwrap:
    name: "Force unwrap named colors"
    regex: "UIColor\\(named: .*\\)!"
    message: "Please do not force unwrap named colors as Bundle.main may be inaccessible in some contexts (e.g. unit tests)"
    severity: error
  no_localized_string:
    name: "No NSLocalizedString"
    regex: "NSLocalizedString"
    message: "Strings come from generated resource shims"
    severity: error
  weak_attached_controller:
    name: "Weak Attached Controller"
    regex: "^(?!.*weak\\s+var)\\s*(?:public\\s+)?var\\s+attachedController"
    message: "Please use weak var for attachedControllers"
    severity: error
    excluded: ".*/ScreenViewControllerModel\\.swift"
  sf_safe_symbol:
    name: "Safe SFSymbol"
    message: "Use `SFSafeSymbols` via `systemSymbol` parameters for type safety."
    regex: "(Image\\(systemName:)|(NSImage\\(symbolName:)|(Label[^,]+?,\\s*systemImage:)|(UIApplicationShortcutIcon\\(systemImageName:)"
    severity: error

strict: true

excluded:
  - bin
  - local
  - .build
  - .swiftpm  
  - .dependency_magnet
  - System
